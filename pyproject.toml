[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (black handles line wrapping)
    "B028",  # no explicit stacklevel in warnings
    "B905",  # zip without strict=
    "UP031", # printf-style formatting
    "UP038", # isinstance with union syntax
]

[tool.ruff.lint.isort]
known-first-party = ["libscientific"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/python_bindings/tests/*" = ["F401", "F403", "F405"]

[tool.mypy]
python_version = "3.10"
files = ["src/python_bindings/libscientific"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["src/python_bindings/tests"]
pythonpath = ["src/python_bindings"]

[tool.pylint.messages_control]
disable = [
    "C",
    "R",
    "duplicate-code",
    "cyclic-import",
    "line-too-long",
    "invalid-name",
    "broad-exception-caught",
    "protected-access",
    "unused-argument",
]
