name: Code Quality & Linting

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  lint:
    name: Linters & Pre-commit (Black, Ruff, Flake8, Mypy, Pylint)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black ruff flake8 mypy pylint

      - name: Run Pre-commit Hooks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

      - name: Run Mypy Static Typecheck
        run: |
          mypy src/python_bindings/libscientific

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check src/python_bindings
          ruff format --check src/python_bindings

      - name: Run Black Code Formatting Check
        run: |
          black --check src/python_bindings

      - name: Run Flake8 Style Check
        run: |
          flake8 src/python_bindings

      - name: Run Pylint Analysis
        run: |
          pylint --rcfile=pyproject.toml src/python_bindings/libscientific/*.py
